name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes the older run's result meaningless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: Lint and unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      # The lockfile is resolved for the oldest supported PHP (composer.json's
      # platform pin), so one install works across the whole matrix.
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer test

  plugin-check:
    name: WordPress ${{ matrix.wp }}, PHP ${{ matrix.php }} (activation and Plugin Check)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # trunk is allowed to fail the build on purpose: it is the early warning
        # for what the next WordPress release will break.
        wp: ['6.4', 'latest', 'trunk']
        # PHP 7.4 is deliberately absent. wp-env builds its PHP 7.4 image from a Debian
        # bullseye base, whose apt mirrors now answer 404, so the image cannot be built
        # and both 7.4 cells failed on infrastructure with our code untouched. PHP 7.4
        # is still covered by the lint and unit jobs and by the syntax check of the built
        # zip in the release-zip job below.
        php: ['8.1', '8.4']
        exclude:
          # WordPress 6.4 is not tested on PHP 8.4.
          - wp: '6.4'
            php: '8.4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The site runs the built zip's contents, not the working tree, so activation
      # and Plugin Check judge what wordpress.org would actually receive: Plugin Check
      # on the working tree flags .github and CLAUDE.md, which never ship.
      - run: bin/build-zip
      - name: Configure wp-env for this cell
        run: |
          case "${{ matrix.wp }}" in
            latest) core=null ;;
            trunk)  core='"WordPress/WordPress#master"' ;;
            *)      core='"WordPress/WordPress#${{ matrix.wp }}"' ;;
          esac
          printf '{ "core": %s, "phpVersion": "%s", "mappings": { "wp-content/plugins/readiness-index": "./dist/readiness-index" } }\n' "$core" "${{ matrix.php }}" > .wp-env.override.json
          cat .wp-env.override.json
      - run: npx wp-env start
      - name: The plugin is active
        run: |
          npx wp-env run cli wp plugin is-active readiness-index
          npx wp-env run cli wp eval 'echo "WordPress " . get_bloginfo("version") . ", PHP " . PHP_VERSION . "\n";'
      # The strictest form, on the built zip's contents: every check including the experimental
      # ones and the low-severity errors and warnings. Plugin Check exits 0 with warnings on the
      # screen and prints nothing at all when there are none, so the step fails on any finding.
      - name: Plugin Check, strictest, zero findings
        run: |
          out="$(npx wp-env run cli wp plugin check readiness-index --format=table --severity=0 --include-experimental --include-low-severity-errors --include-low-severity-warnings 2>&1)"
          echo "${out}"
          if echo "${out}" | grep -q '^FILE:'; then
            echo "::error::Plugin Check reported findings"
            exit 1
          fi
          echo "${out}" | grep -q 'No errors found'

  integration:
    name: Integration, WordPress ${{ matrix.wp }}, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    # A cell on WordPress trunk may fail without failing the workflow: it is the early warning
    # that a release changed something this plugin reads. The cell still shows red, and its last
    # step says so.
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { wp: '6.4', php: '8.1', allow_failure: false }
          - { wp: latest, php: '8.4', allow_failure: false }
          - { wp: trunk, php: '8.4', allow_failure: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
          coverage: none
      # The tests run inside wp-env's container, from the working tree, so vendor/ is needed.
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - name: Configure wp-env for this cell
        run: |
          case "${{ matrix.wp }}" in
            latest) core=null ;;
            trunk)  core='"WordPress/WordPress#master"' ;;
            *)      core='"WordPress/WordPress#${{ matrix.wp }}"' ;;
          esac
          printf '{ "core": %s, "phpVersion": "%s", "lifecycleScripts": { "afterStart": null } }\n' "$core" "${{ matrix.php }}" > .wp-env.override.json
          cat .wp-env.override.json
      - run: npx wp-env start
      - name: Integration tests
        run: |
          npx wp-env run tests-cli --env-cwd=wp-content/plugins/readiness-index \
            vendor/bin/phpunit -c phpunit-integration.xml.dist
      - name: Say so when a cell that is allowed to fail did
        if: ${{ failure() && matrix.allow_failure }}
        run: echo "::warning title=Early warning::WordPress ${{ matrix.wp }} failed. The workflow stays green; read the log before the next release of WordPress is trusted."

  contract-pin:
    name: The copied API contract is the pinned web commit's
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.WEB_REPO_READ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned web commit
        id: pin
        run: echo "commit=$(sed -n 's/^web_commit //p' docs/contract/PIN)" >> "$GITHUB_OUTPUT"
      # The web repository is private. With a read token in WEB_REPO_READ_TOKEN the copy is
      # compared with the real files at the pinned commit; without one this job says so and
      # the unit suite's ContractTest still fails on any hand edit, because it checks every
      # copied file against the pin's hashes.
      - name: Check out the web repository at the pin
        if: ${{ env.HAS_TOKEN == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: ten7/ai-readiness-index
          ref: ${{ steps.pin.outputs.commit }}
          token: ${{ secrets.WEB_REPO_READ_TOKEN }}
          path: web
          sparse-checkout: |
            docs/cms-fixtures
            docs/cms-parity
      - name: The copy matches the pin
        if: ${{ hashFiles('web/docs/cms-fixtures/openapi.json') != '' }}
        run: |
          diff -r web/docs/cms-fixtures tests/fixtures/cms
          php bin/filter-strings web/docs/cms-parity/strings/en.json | diff - strings/en.json
          diff web/docs/cms-parity/screens.md docs/contract/screens.md
          diff web/docs/cms-parity/MATRIX.md docs/contract/MATRIX.md
      - name: No token, so only the hash pin is checked
        if: ${{ hashFiles('web/docs/cms-fixtures/openapi.json') == '' }}
        run: echo "::notice::WEB_REPO_READ_TOKEN is not set; the copy was checked against the pin's hashes only (ContractTest)."

  release-zip:
    name: Release zip has no development files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same script a person runs locally. It fails when the zip holds tests,
      # vendor, node_modules, .github, composer files or docs.
      - run: bin/check-version
      - run: bin/build-zip
      - name: The Pantheon deploy script's tests (shimmed, no network)
        run: tests/deploy-pantheon-test.sh
      # Plugin Requires PHP: 7.4, but wp-env cannot build a 7.4 site (see the
      # plugin-check matrix), so the shipped files are parsed by a real 7.4 binary here.
      # It reads the unpacked zip and not the working tree: syntax that only a file
      # excluded from the release contains is not our concern, and one that ships is.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: Every PHP file in the built zip parses on PHP 7.4
        run: |
          php -v | head -1
          unpacked="$(mktemp -d)"
          unzip -q dist/*.zip -d "${unpacked}"
          count=0
          while IFS= read -r -d '' file; do
            php -l "${file}" > /dev/null
            count=$((count + 1))
          done < <(find "${unpacked}" -name '*.php' -print0)
          echo "Parsed ${count} PHP files"
          test "${count}" -gt 0
      - uses: actions/upload-artifact@v4
        with:
          name: readiness-index-zip
          path: dist/*.zip
          if-no-files-found: error
